name: Release

on:
  push:
    branches:
      - main

jobs:
  version:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./onglink

    steps:
      # ==========================================
      # PARTE 1 - Configuração e Testes
      # ==========================================
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0 # Necessário buscar o histórico para calcular a versão

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependências
        run: npm install

      - name: Rodar build
        run: npm run build

      - name: Testes unitarios
        run: npm test

      - name: Validar Build do Docker
        run: docker build -t onglink-frontend:test .

      # ==========================================
      # PARTE 2 - Automação de Versão
      # ==========================================
      - name: Instalar semver
        run: npm install -g semver

      - name: Criar nova tag caso não exista
        id: create_initial_tag
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$(git tag)" ]; then
            git config --global user.name 'github-actions'
            git config --global user.email 'github-actions@github.com'
            git tag -a v0.0.0 -m "Initial release"
            git push origin v0.0.0 || echo "Tag ja existe"
          fi

      - name: Calcular nova versão
        id: version
        run: |
          git fetch --tags
          LAST_TAG=$(git describe --tags `git rev-list --tags --max-count=1` 2>/dev/null || echo "v0.0.0")
          echo "Versão Atual: $LAST_TAG"

          if [ "$LAST_TAG" = "v0.0.0" ]; then
            COMMITS=$(git log --pretty=format:"%s")
          else
            COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s")
          fi

          MAJOR=0
          MINOR=0
          PATCH=0

          while read -r COMMIT; do
            if [[ "$COMMIT" == *"BREAKING CHANGE"* ]]; then MAJOR=1
            elif [[ "$COMMIT" == *"feat"* ]]; then MINOR=1
            elif [[ "$COMMIT" == *"fix"* ]]; then PATCH=1
            fi
          done <<< "$COMMITS"

          CURRENT_VERSION=${LAST_TAG#v}
          NEW_VERSION=$CURRENT_VERSION

          if [[ $MAJOR -eq 1 ]]; then 
            NEW_VERSION=$(semver -i major $CURRENT_VERSION)
          elif [[ $MINOR -eq 1 ]]; then 
            NEW_VERSION=$(semver -i minor $CURRENT_VERSION)
          else 
            NEW_VERSION=$(semver -i patch $CURRENT_VERSION)
          fi

          echo "Nova versão calculada: $NEW_VERSION"
          # Exportando para o GITHUB_ENV para ser usado nos próximos steps
          echo "new_version=$NEW_VERSION" >> $GITHUB_ENV

      # ==========================================
      # PARTE 3 - Integração Docker Hub
      # ==========================================
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Definir o nome do repositório
        run: |
          REPO_NAME="${{ github.repository }}"
          REPO_NAME="${REPO_NAME#*/}"

          # Converte tudo para minúsculo, pois o Docker não aceita maiúsculas em tags
          REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          # Exportando o nome do repositório
          echo "REPO_NAME=$REPO_NAME" >> $GITHUB_ENV 
          echo "Repositório: $REPO_NAME"

      - name: Verificar e criar repositório no Docker Hub (se necessário)
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          # Usando a secret correta validada na sua imagem:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "Verificando repositório: ${{ env.REPO_NAME }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -u $DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN \
            "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/${{ env.REPO_NAME }}/")

          if [ "$RESPONSE" -eq 404 ]; then
            echo "Repositório não existe. Criando repositório no Docker Hub..."
            curl -s -X POST -u $DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN \
              -H "Content-Type: application/json" \
              -d '{"name": "${{ env.REPO_NAME }}", "is_private": true}' \
              "https://hub.docker.com/v2/repositories/$DOCKERHUB_USERNAME/"
            echo "Repositório ${{ env.REPO_NAME }} criado com sucesso!"
          else
            echo "Repositório ${{ env.REPO_NAME }} já existe no Docker Hub."
          fi

      - name: Criar imagem docker
        run: |
          echo "Iniciando build da imagem Docker para o repositório ${{ env.REPO_NAME }} - Versão: ${{ env.new_version }}"

          # Usando as variáveis exportadas corretamente
          docker build \
            --build-arg NEXT_PUBLIC_API_URL=http://localhost:4000/api \
            --build-arg NEXT_PUBLIC_API_KEY=${{ secrets.NEXT_PUBLIC_API_KEY }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.new_version }} .
            
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.new_version }} ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:latest

      - name: Efetuar push da imagem
        run: |
          echo "Fazendo push da imagem Docker para o Docker Hub ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.new_version }}" 

          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:${{ env.new_version }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.REPO_NAME }}:latest

      # ==========================================
      # PARTE 4 - Atualização Git e Notificações
      # ==========================================
      - name: Atualizar versão no package.json
        run: npm version ${{ env.new_version }} --no-git-tag-version

      - name: Commit e push
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add package.json
          git commit -m "chore(release): version ${{ env.new_version }} [skip ci]" || echo "Sem mudanças"
          git tag v${{ env.new_version }}
          git push origin main --tags

      - name: Send mail
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.EMAIL_ORIGEM }}
          password: ${{ secrets.SENHA_EMAIL }}
          subject: "Falha no workflow do GitHub Actions"
          to: ${{ secrets.MAIL_DESTINO }}
          from: "${{ secrets.MAIL_DESTINO}} - Github Actions"
          body: "Ocorreu uma FALHA no build do repositorio ${{ github.repository }}! Verifique o log do Github Actions para corrigir o erro."

      # ==========================================
      # PARTE 5 - SONAR QUBE
      # ==========================================
      - name: SonarCloud Scan
        # uses: SonarSource/sonarCloud-github-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432
        with:
          projectBaseDir: ./onglink
        env:
          SONAR_TOKEN: ${{secrets.SONAR_TOKEN}}
